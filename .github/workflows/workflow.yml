name: CI/CD

# Thin trigger. The pipeline lives in C# — invoke the runfile, not ./bin/dev.
# bin/dev is gitignored, so a fresh CI checkout does not have it. The
# `workflow` command self-installs first, then runs ./bin/dev clean|build|test|pack.
# push/PR: self-install → clean → build → test → pack.
# release: promote the CI-built Packages-* artifact (no rebuild) and push to nuget.org.
# probe: OIDC login only, no build and no push.
on:
  push:
    branches: [ master ]
    # A kanban-only merge must not rebuild. Pull requests do not use this filter.
    # readme.md and assets/logo.png are packed into the nupkg, so they stay here.
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'source/Directory.Build.props'
      - 'msbuild/**'
      - 'nuget.config'
      - '.editorconfig'
      - 'readme.md'
      - 'assets/logo.png'
      - 'timewarp-builder.slnx'
      - 'BannedSymbols.txt'
  pull_request:
    # No paths filter: every pull request reports CI. The pipeline decides what to run.
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = clean, build, test, and pack (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
      # write: keep-last-two prune deletes older Packages-* artifacts.
      # Release-mode list/download still works with write (superset of read).
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for the release gate's tag/ancestor checks

      # dotnet-quality applies to every version in the same step. The 10.0 preview
      # channel is still the 10.0 RC, so the .NET 11 RC is a separate step.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run CI Pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        env:
          # Job token: release mode's locate-run / download-artifact read this
          # repo's Actions runs and artifacts through gh.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release' }}" == "true" ]; then
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          else
            dotnet run --file tools/dev-cli/dev.cs -- workflow
          fi

      - name: Upload Artifacts
        # Green master only: release mode promotes Packages-* from a push run at
        # the tag SHA. Skip PRs, failed runs, probe (no nupkgs), and release /
        # break-glass runs (they just downloaded the same bytes).
        id: upload-packages
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe'))
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | [.created_at, (.id | tostring), .name] | @tsv' \
            | LC_ALL=C sort -r > "$tmp"
          if ! cut -f3 "$tmp" | grep -qxF "$EXPECTED_ARTIFACT"; then
            echo "Just-uploaded artifact ${EXPECTED_ARTIFACT} is not listed yet; skipping prune (keep-last-2 runs on the next green master push)."
            exit 0
          fi
          keep=2
          n=0
          while IFS=$'\t' read -r created_at id name; do
            [ -n "$id" ] || continue
            n=$((n + 1))
            if [ "$n" -le "$keep" ]; then
              echo "Keeping ${name} (id=${id}, created=${created_at})"
              continue
            fi
            echo "Deleting ${name} (id=${id}, created=${created_at})"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done < "$tmp"
